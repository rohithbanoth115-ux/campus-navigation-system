<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Navigator</title>
<style>
:root{--bg:#eef3f1;--panel:#fff;--ink:#16302b;--mute:#5d726d;--line:#cfdad6;--path:#dfe8e4;--bld:#fff;--bldline:#7f9a93;--acc:#0b7a6b;--acc2:#e0a100;--route:#0b7a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b19;--panel:#162724;--ink:#e3efec;--mute:#93aba5;--line:#2a403b;--path:#25393a;--bld:#1b2f2c;--bldline:#4f6f68;--acc:#3fd0bb;--acc2:#f0b82e;--route:#3fd0bb}}
:root[data-theme="dark"]{--bg:#0f1b19;--panel:#162724;--ink:#e3efec;--mute:#93aba5;--line:#2a403b;--path:#25393a;--bld:#1b2f2c;--bldline:#4f6f68;--acc:#3fd0bb;--acc2:#f0b82e;--route:#3fd0bb}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--mute);max-width:60ch}
main{max-width:1100px;margin:0 auto;padding:16px 20px 40px;display:grid;gap:16px;grid-template-columns:320px 1fr}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
select,button{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;margin-top:12px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);margin-top:8px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#summary{margin:14px 0 6px;font-weight:600}
ol{margin:6px 0 0;padding-left:20px;color:var(--ink)}
ol li{margin:6px 0}
ol small{color:var(--mute)}
.mapwrap{padding:8px;overflow-x:auto}
svg{width:100%;height:auto;min-width:520px;display:block}
.edge{stroke:var(--path);stroke-width:16;stroke-linecap:round}
.node rect{fill:var(--bld);stroke:var(--bldline);stroke-width:1.5;transition:fill .15s}
.node text{fill:var(--ink);font-size:13px;text-anchor:middle;pointer-events:none}
.node{cursor:pointer}
.node:hover rect{fill:var(--path)}
.node.from rect{stroke:var(--acc);stroke-width:3}
.node.to rect{stroke:var(--acc2);stroke-width:3}
.junc circle{fill:var(--bldline)}
#route{fill:none;stroke:var(--route);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8}
@media (prefers-reduced-motion:no-preference){#route.go{animation:flow .9s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-18}}
.hint{color:var(--mute);font-size:.85rem;margin:8px 4px 0}
</style>
</head>
<body>
<header>
<h1>Campus Navigator</h1>
<p>Find the shortest walking route between any two places on campus. Pick locations below or click buildings on the map.</p>
</header>
<main>
<section class="panel" aria-label="Route planner">
<label for="from">From</label><select id="from"></select>
<label for="to">To</label><select id="to"></select>
<button id="go">Show route</button>
<button id="swap" class="ghost">Swap locations</button>
<div id="summary" aria-live="polite">Choose a start and a destination.</div>
<ol id="steps"></ol>
</section>
<section class="panel mapwrap" aria-label="Campus map">
<svg id="map" viewBox="0 0 800 520" role="img" aria-label="Campus map"></svg>
<p class="hint">Click a building to set the start, then another to set the destination.</p>
</section>
</main>
<script>
// Campus data: edit names and coordinates to match your campus.
var N=[
["gate","Main Gate",60,260,"b"],["j1","West crossing",200,260,"j"],["j2","Central crossing",400,260,"j"],["j3","East crossing",600,260,"j"],
["admin","Admin Block",200,150,"b"],["lib","Library",400,140,"b"],["sci","Science Block",600,150,"b"],
["eng","Engineering Block",200,390,"b"],["canteen","Canteen",400,390,"b"],["sports","Sports Ground",600,390,"b"],["hostel","Hostel",730,260,"b"]];
var E=[["gate","j1"],["j1","j2"],["j2","j3"],["j1","admin"],["j2","lib"],["j3","sci"],["j1","eng"],["j2","canteen"],["j3","sports"],["j3","hostel"],["eng","canteen"],["canteen","sports"]];
var M_PER_PX=0.6, WALK=80; // metres per map pixel, metres per minute
var nodes={},adj={};
N.forEach(function(n){nodes[n[0]]={id:n[0],name:n[1],x:n[2],y:n[3],t:n[4]};adj[n[0]]=[]});
E.forEach(function(e){var a=nodes[e[0]],b=nodes[e[1]],d=Math.hypot(a.x-b.x,a.y-b.y)*M_PER_PX;adj[a.id].push([b.id,d]);adj[b.id].push([a.id,d])});
var $=function(i){return document.getElementById(i)},NS="http://www.w3.org/2000/svg";
var svg=$("map"),from=$("from"),to=$("to"),pick="from";
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
E.forEach(function(e){var a=nodes[e[0]],b=nodes[e[1]];el("line",{class:"edge",x1:a.x,y1:a.y,x2:b.x,y2:b.y})});
var route=el("polyline",{id:"route",points:""});
var gs={};
N.forEach(function(n){
 var o=document.createElement("option");o.value=n[0];o.textContent=n[1];
 if(n[4]==="b"){from.appendChild(o);to.appendChild(o.cloneNode(true))}
 if(n[4]==="j"){var g=el("g",{class:"junc"});el("circle",{cx:n[2],cy:n[3],r:5},g);return}
 var g=el("g",{class:"node",tabindex:0,role:"button","aria-label":n[1]});
 var w=Math.max(84,n[1].length*8+20);
 el("rect",{x:n[2]-w/2,y:n[3]-20,width:w,height:40,rx:8},g);
 var t=el("text",{x:n[2],y:n[3]+5},g);t.textContent=n[1];
 g.addEventListener("click",function(){choose(n[0])});
 g.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(n[0])}});
 gs[n[0]]=g;
});
from.value="gate";to.value="lib";
function choose(id){
 if(pick==="from"){from.value=id;pick="to"}else{to.value=id;pick="from"}
 mark();if(from.value!==to.value&&pick==="from")solve();
}
function mark(){for(var k in gs)gs[k].classList.remove("from","to");gs[from.value].classList.add("from");gs[to.value].classList.add("to")}
function dijkstra(s,t){
 var d={},p={},q=Object.keys(nodes);q.forEach(function(k){d[k]=Infinity});d[s]=0;
 while(q.length){q.sort(function(a,b){return d[a]-d[b]});var u=q.shift();if(u===t||d[u]===Infinity)break;
  adj[u].forEach(function(e){var alt=d[u]+e[1];if(alt<d[e[0]]){d[e[0]]=alt;p[e[0]]=u}})}
 var path=[t];while(path[0]!==s&&p[path[0]])path.unshift(p[path[0]]);
 return path[0]===s?{path:path,dist:d[t]}:null;
}
function solve(){
 mark();var s=from.value,t=to.value,steps=$("steps"),sum=$("summary");
 steps.innerHTML="";route.classList.remove("go");
 if(s===t){route.setAttribute("points","");sum.textContent="You are already there. Choose a different destination.";return}
 var r=dijkstra(s,t);
 if(!r){sum.textContent="No walking route found between these places.";return}
 route.setAttribute("points",r.path.map(function(i){return nodes[i].x+","+nodes[i].y}).join(" "));
 route.classList.add("go");
 var mins=Math.max(1,Math.round(r.dist/WALK));
 sum.textContent=Math.round(r.dist)+" m, about "+mins+" min walk";
 for(var i=0;i<r.path.length-1;i++){
  var a=nodes[r.path[i]],b=nodes[r.path[i+1]],d=Math.round(Math.hypot(a.x-b.x,a.y-b.y)*M_PER_PX);
  var li=document.createElement("li");li.innerHTML="Walk from "+a.name+" to "+b.name+" <small>("+d+" m)</small>";steps.appendChild(li);
 }
}
$("go").onclick=solve;
$("swap").onclick=function(){var v=from.value;from.value=to.value;to.value=v;solve()};
from.onchange=to.onchange=solve;
solve();
</script>
</body>
</html>
